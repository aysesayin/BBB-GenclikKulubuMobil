name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Kod üretimi (l10n + freezed)
        run: dart run tool/codegen.dart --build
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/codegen.dart --build
      - name: APK (${{ matrix.env }})
        run: flutter build apk --release --dart-define=ENV=${{ matrix.env }} --dart-define=MOCK=${{ matrix.env == 'dev' }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.env }}
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/codegen.dart --build
      - name: iOS (imzasız)
        run: flutter build ios --release --no-codesign --dart-define=ENV=staging --dart-define=MOCK=false
